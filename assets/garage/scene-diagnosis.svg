<svg viewBox="0 0 1200 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diagTitle">
<title id="diagTitle">Illustration of a technician explaining a repair to a homeowner beside an open garage door</title>
<defs>
  <linearGradient id="dInt" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#3D4058"/>
    <stop offset="100%" stop-color="#29231F"/>
  </linearGradient>
  <linearGradient id="dLight" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F0DCD0" stop-opacity=".5"/>
    <stop offset="100%" stop-color="#F0DCD0" stop-opacity="0"/>
  </linearGradient>
</defs>
<rect width="1200" height="1000" fill="url(#dInt)"/>

<!-- open door wedge of daylight -->
<path d="M0,1000 L360,240 L1200,240 L1200,1000 Z" fill="url(#dLight)" opacity=".5"/>

<!-- floor -->
<rect x="0" y="760" width="1200" height="240" fill="#3A322B"/>
<line x1="0" y1="760" x2="1200" y2="760" stroke="#4A4640" stroke-width="4"/>

<!-- track overhead -->
<g stroke="#A94F31" stroke-width="5" opacity=".85">
  <line x1="360" y1="260" x2="900" y2="260"/>
  <line x1="900" y1="260" x2="900" y2="480"/>
</g>
<circle cx="620" cy="260" r="10" fill="#E7B8A2"/>
<circle cx="760" cy="260" r="10" fill="#E7B8A2"/>

<!-- roller/cable assembly detail -->
<g transform="translate(900,300)">
  <rect x="-14" y="0" width="28" height="140" rx="8" fill="#3D4058" stroke="#E7B8A2" stroke-width="3"/>
  <circle cx="0" cy="0" r="16" fill="#29231F" stroke="#E7B8A2" stroke-width="3"/>
</g>

<!-- technician crouching, pointing -->
<g transform="translate(560,660)">
  <path d="M-40,120 C-44,60 -30,10 0,0 C30,10 44,60 40,120 Z" fill="#29231F"/>
  <path d="M18,-4 C60,-10 96,20 120,-60" stroke="#29231F" stroke-width="20" stroke-linecap="round" fill="none"/>
  <circle cx="122" cy="-64" r="9" fill="#E7B8A2"/>
  <path d="M-16,10 C-40,26 -48,54 -40,80" stroke="#29231F" stroke-width="18" stroke-linecap="round" fill="none"/>
  <path d="M-20,116 L-40,180 L-10,200" stroke="#29231F" stroke-width="20" stroke-linecap="round" fill="none"/>
  <path d="M16,116 L50,150 L90,150" stroke="#29231F" stroke-width="20" stroke-linecap="round" fill="none"/>
  <circle cx="0" cy="-22" r="20" fill="#29231F"/>
  <path d="M-20,-28 a20,20 0 0 1 40,0 l6,-2 -2,-10 -44,0 -2,10 Z" fill="#A94F31"/>
  <rect x="-40" y="106" width="80" height="9" fill="#A94F31" opacity=".9"/>
</g>

<!-- homeowner standing, listening -->
<g transform="translate(340,600)">
  <path d="M-34,180 C-38,100 -24,20 0,10 C24,20 38,100 34,180 Z" fill="#4A4640"/>
  <path d="M-16,20 C-36,34 -42,58 -36,84" stroke="#4A4640" stroke-width="17" stroke-linecap="round" fill="none"/>
  <path d="M16,20 C36,34 40,54 34,76" stroke="#4A4640" stroke-width="17" stroke-linecap="round" fill="none"/>
  <path d="M-14,178 L-20,300" stroke="#4A4640" stroke-width="20" stroke-linecap="round"/>
  <path d="M14,178 L20,300" stroke="#4A4640" stroke-width="20" stroke-linecap="round"/>
  <circle cx="0" cy="-16" r="22" fill="#e9c99a"/>
  <path d="M-22,-20 a22,26 0 1 1 44,0 c0,10 -6,10 -6,2 c0,-14 -32,-14 -32,0 c0,8 -6,8 -6,-2 Z" fill="#29231F"/>
</g>

<rect x="0" y="0" width="1200" height="1000" fill="#29231F" opacity=".04"/>
</svg>
