<svg viewBox="0 0 1600 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="outTitle">
<title id="outTitle">Illustration of a finished, fully open garage door at dusk with the service van departing</title>
<defs>
  <linearGradient id="duskSky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#2c1f3a"/>
    <stop offset="45%" stop-color="#5a3a2e"/>
    <stop offset="100%" stop-color="#0a1a28"/>
  </linearGradient>
  <radialGradient id="sun" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#e0b568" stop-opacity=".9"/>
    <stop offset="100%" stop-color="#e0b568" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="1600" height="700" fill="url(#duskSky)"/>
<circle cx="1250" cy="150" r="230" fill="url(#sun)"/>
<circle cx="1250" cy="150" r="70" fill="#f0c98a"/>

<rect x="0" y="520" width="1600" height="180" fill="#0d1522"/>

<!-- house silhouette -->
<rect x="300" y="260" width="820" height="270" fill="#1a1114"/>
<path d="M280,270 L710,90 L1140,270 Z" fill="#120b0d"/>

<!-- open garage, warm interior glow -->
<rect x="640" y="330" width="330" height="200" fill="#f0c98a" opacity=".18"/>
<rect x="640" y="330" width="330" height="200" fill="none" stroke="#e0b568" stroke-width="4"/>
<g stroke="#5a3a2e" stroke-width="3">
  <line x1="640" y1="370" x2="970" y2="370"/>
  <line x1="640" y1="410" x2="970" y2="410"/>
  <line x1="640" y1="450" x2="970" y2="450"/>
  <line x1="640" y1="490" x2="970" y2="490"/>
</g>

<!-- van driving away -->
<g transform="translate(1120,540)">
  <rect x="0" y="-46" width="190" height="76" rx="10" fill="#e9e2d2" opacity=".92"/>
  <rect x="0" y="-70" width="96" height="30" rx="6" fill="#e9e2d2" opacity=".92"/>
  <circle cx="34" cy="34" r="17" fill="#0a1a28"/>
  <circle cx="160" cy="34" r="17" fill="#0a1a28"/>
</g>

<rect width="1600" height="700" fill="#0a1a28" opacity=".08"/>
</svg>
