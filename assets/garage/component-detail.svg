<svg viewBox="0 0 1000 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="compTitle">
<title id="compTitle">Detail illustration of a torsion spring, cable drum and steel track</title>
<defs>
  <linearGradient id="cBg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#3D4058"/>
    <stop offset="100%" stop-color="#29231F"/>
  </linearGradient>
</defs>
<rect width="1000" height="900" fill="url(#cBg)"/>

<!-- header plate -->
<rect x="80" y="120" width="840" height="40" rx="6" fill="#3A322B" stroke="#4A4640" stroke-width="3"/>

<!-- shaft -->
<rect x="90" y="330" width="820" height="24" rx="12" fill="#3A322B" stroke="#4A4640" stroke-width="4"/>

<!-- spring coil, large -->
<g stroke="#E7B8A2" stroke-width="12" fill="none" stroke-linecap="round">
  <path d="M150,342 q26,-70 52,0 q26,70 52,0 q26,-70 52,0 q26,70 52,0 q26,-70 52,0 q26,70 52,0 q26,-70 52,0 q26,70 52,0 q26,-70 52,0 q26,70 52,0"/>
</g>
<!-- mounting bracket -->
<rect x="120" y="300" width="30" height="90" fill="#3A322B" stroke="#A94F31" stroke-width="4"/>

<!-- cable drum + cable -->
<circle cx="770" cy="342" r="70" fill="#3A322B" stroke="#A94F31" stroke-width="10"/>
<circle cx="770" cy="342" r="18" fill="#A94F31"/>
<path d="M700,342 Q560,342 560,470 L560,760" stroke="#EFE9E1" stroke-width="6" fill="none"/>

<!-- vertical track -->
<rect x="530" y="470" width="60" height="330" fill="#3A322B" stroke="#4A4640" stroke-width="5"/>
<g fill="#E7B8A2">
  <circle cx="560" cy="530" r="11"/>
  <circle cx="560" cy="620" r="11"/>
  <circle cx="560" cy="710" r="11"/>
</g>

<!-- callout leader lines + labels -->
<g font-family="Inter, sans-serif" font-size="20" fill="#FFFFFF">
  <line x1="330" y1="300" x2="330" y2="230" stroke="#A94F31" stroke-width="2"/>
  <text x="230" y="215">TORSION SPRING</text>

  <line x1="770" y1="260" x2="770" y2="200" stroke="#A94F31" stroke-width="2"/>
  <text x="700" y="185">CABLE DRUM</text>

  <line x1="560" y1="600" x2="680" y2="600" stroke="#A94F31" stroke-width="2"/>
  <text x="690" y="606">ROLLER TRACK</text>
</g>

<rect width="1000" height="900" fill="#29231F" opacity=".04"/>
</svg>
